services:
  dev:
    build: .
    ports:
      - "3006:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: npm run start -- --host 0.0.0.0 --poll 1000

  build:
    build: .
    profiles: ["build"]
    ports:
      - "3006:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "npm run build && npm run serve -- --host 0.0.0.0 --port 3000"

volumes:
  node_modules:
