services:
  infohelp_egisz:
    build: .
    ports:
      - "3006:3000"
    volumes:
      - .:/app
      - /app/node_modules
      # Generated absolute paths must stay inside the Linux container.
      - /app/.docusaurus
      - /app/build
    command: sh -c "npm ci --no-audit --no-fund && npm run start -- --host 0.0.0.0 --poll 1000"
